[tool.ruff]
line-length = 100
extend-exclude = ["app/db/migrations/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long assertions and inline test data read better unwrapped
"mutation/**" = ["E501"]  # mutant snippets are verbatim source lines and must not be wrapped

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast unit tier by default; the Postgres/Redis integration tier runs with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = ["integration: needs the docker-compose Postgres (pgvector) and Redis services"]
